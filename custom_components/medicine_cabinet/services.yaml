    medication_id:
      name: Identifiant du médicament
      description: Identifiant interne du médicament (voir l'attribut "id" du capteur).
      required: true
      selector:
        text:
    name:
      name: Nom
      selector:
        text:
    quantity:
      name: Quantité
      selector:
        number:
          min: 0
          mode: box
    unit:
      name: Unité
      selector:
        text:
    expiration_date:
      name: Date de péremption
      selector:
        date:
    purpose:
      name: Utilité
      selector:
        text:
    category:
      name: Catégorie
      selector:
        text:
    minimum_quantity:
      name: Quantité minimale
      selector:
        number:
          min: 0
          mode: box
    location:
      name: Emplacement
      selector:
        text:
    notes:
      name: Notes
      selector:
        text:
          multiline: true

remove_medication:
  name: Supprimer un médicament
  description: Supprime un médicament de l'armoire à pharmacie.
  fields:
    config_entry_id:
      name: Armoire à pharmacie
      description: L'armoire à pharmacie concernée.
      required: true
      selector:
        config_entry:
          integration: medicine_cabinet
    medication_id:
      name: Identifiant du médicament
      description: Identifiant interne du médicament à supprimer.
      required: true
      selector:
        text:

consume:
  name: Consommer / prendre le médicament
  description: Diminue la quantité en stock d'un médicament.
  fields:
    config_entry_id:
      name: Armoire à pharmacie
      description: L'armoire à pharmacie concernée.
      required: true
      selector:
        config_entry:
          integration: medicine_cabinet
    medication_id:
      name: Identifiant du médicament
      description: Identifiant interne du médicament.
      required: true
      selector:
        text:
    amount:
      name: Quantité
      description: Quantité à retirer du stock.
      required: true
      example: 1
      selector:
        number:
          min: 0
          mode: box

restock:
  name: Réapprovisionner
  description: Augmente la quantité en stock d'un médicament.
  fields:
    config_entry_id:
      name: Armoire à pharmacie
      description: L'armoire à pharmacie concernée.
      required: true
      selector:
        config_entry:
          integration: medicine_cabinet
    medication_id:
      name: Identifiant du médicament
      description: Identifiant interne du médicament.
      required: true
      selector:
        text:
    amount:
      name: Quantité
      description: Quantité à ajouter au stock.
      required: true
      example: 20
      selector:
        number:
          min: 0
          mode: box
